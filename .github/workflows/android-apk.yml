name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Fetch the Russian Trusted Root CA for GigaChat API
        run: |
          mkdir -p certs
          curl -fsSL --retry 3 https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o certs/russian_trusted_root_ca.pem
          fp=$(openssl x509 -in certs/russian_trusted_root_ca.pem -noout -fingerprint -sha256 | cut -d= -f2)
          # Fingerprint published at https://developers.sber.ru/docs/en/smarthome/c2c/ca
          test "$fp" = "D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: meeting-assistant-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish APK as a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk meeting-assistant.apk
          tag="build-${{ github.run_number }}"
          gh release create "$tag" meeting-assistant.apk --target "${{ github.sha }}" \
            --title "Сборка ${{ github.run_number }}" --notes "APK для Android (arm64)." --latest
